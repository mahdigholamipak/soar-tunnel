name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-go:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build Linux Server & Client (AMD64)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/soar-server-linux-amd64 ./cmd/soar-server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/soar-client-linux-amd64 ./cmd/soar-client

      - name: Build Linux Server & Client (ARM64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/soar-server-linux-arm64 ./cmd/soar-server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/soar-client-linux-arm64 ./cmd/soar-client

      - name: Build Windows Client CLI (AMD64)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/soar-client-windows-amd64.exe ./cmd/soar-client

      - name: Build Android Binaries
        run: |
          mkdir -p dist/android-assets
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/android-assets/soar-client-arm64 ./cmd/soar-client
          CGO_ENABLED=0 GOOS=android GOARCH=arm go build -trimpath -ldflags="-s -w" -o dist/android-assets/soar-client-arm ./cmd/soar-client
          CGO_ENABLED=0 GOOS=android GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/android-assets/soar-client-amd64 ./cmd/soar-client

      - name: Upload Core Binaries
        uses: actions/upload-artifact@v4
        with:
          name: core-binaries
          path: dist/*

  build-windows:
    name: Build Windows GUI Client
    runs-on: windows-latest
    needs: build-go
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Core Binaries
        uses: actions/download-artifact@v4
        with:
          name: core-binaries
          path: dist

      - name: Publish Windows GUI Client
        shell: pwsh
        run: |
          dotnet publish windows/SoarClient.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o build_win
          Copy-Item dist/soar-client-windows-amd64.exe -Destination build_win/soar-client.exe
          Copy-Item configs/client_config.sample.toml -Destination build_win/client_config.sample.toml
          Copy-Item configs/client_resolvers.sample.txt -Destination build_win/client_resolvers.txt
          Compress-Archive -Path build_win/* -DestinationPath dist/Soar-Windows-GUI-win64.zip -Force

      - name: Upload Windows GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui
          path: dist/Soar-Windows-GUI-win64.zip

  build-android:
    name: Build Android Proxy-Only APK
    runs-on: ubuntu-latest
    needs: build-go
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Core Binaries
        uses: actions/download-artifact@v4
        with:
          name: core-binaries
          path: dist

      - name: Bundle Android Binaries into Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp dist/android-assets/* android/app/src/main/assets/
          cp configs/client_resolvers.sample.txt android/app/src/main/assets/client_resolvers.txt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/Soar-Android-ProxyOnly.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/Soar-Android-ProxyOnly.apk

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-go, build-windows, build-android]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Core Binaries
        uses: actions/download-artifact@v4
        with:
          name: core-binaries
          path: release-assets

      - name: Download Windows GUI
        uses: actions/download-artifact@v4
        with:
          name: windows-gui
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Package installer and compute checksums
        run: |
          cd release-assets
          rm -rf android-assets
          cp ../scripts/install.sh ./install.sh
          chmod +x install.sh
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
